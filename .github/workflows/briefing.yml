name: Morning Briefing

on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: briefing

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run briefing
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TRIGGER_SOURCE: ${{ github.event_name }}
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "briefing-bot"
            git config user.email "briefing-bot@users.noreply.github.com"
            git add state/
            git commit -m "state: bookmark and delivered links"
            git push
          fi
